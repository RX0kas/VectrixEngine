name: Vectrix Release

# A tag v* builds the editor in Release on every platform and publishes the archives as a GitHub release.
# Run by hand (Actions tab), it only builds them: the archives are kept as the run's artifacts, nothing is published
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux-x86_64
          - os: windows-latest
            platform: Windows-x86_64
          - os: macos-latest
            platform: macOS-arm64-experimental # never run on real hardware yet

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # Same dependencies as cmake-multi-platform.yml
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          ninja-build \
          libvulkan-dev \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxinerama-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libgl1-mesa-dev \
          libgtk-3-dev

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri https://sdk.lunarg.com/sdk/download/1.4.335.0/windows/vulkan-sdk.exe `
          -OutFile vulkan-sdk.exe

        Start-Process .\vulkan-sdk.exe `
          -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
          -Wait

        echo "VULKAN_SDK=C:\VulkanSDK\1.4.335.0" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\1.4.335.0\Bin" >> $env:GITHUB_PATH

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja -y

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja vulkan-headers vulkan-loader
        echo "VULKAN_SDK=$(brew --prefix)" >> $GITHUB_ENV

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVECTRIX_BUILD_EDITOR=ON

    - name: Build
      run: cmake --build build --parallel

    # The executable with the engine's assets next to it, where AssetsManager looks for them
    - name: Package
      shell: bash
      run: |
        version="${GITHUB_REF_NAME}"
        if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then version="dev-${GITHUB_SHA::7}"; fi
        name="VectrixEditor-${version}-${{ matrix.platform }}"

        bin_dir=$(echo build/bin/Release-*)
        mkdir -p "dist/${name}"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          cp "${bin_dir}/VectrixEditor.exe" "dist/${name}/"
        else
          cp "${bin_dir}/VectrixEditor" "dist/${name}/"
        fi
        cp -r run/assets "dist/${name}/"
        cp LICENSE README.md "dist/${name}/"

        cd dist
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          archive="${name}.zip"
          7z a "${archive}" "${name}" > /dev/null
        else
          archive="${name}.tar.gz"
          tar -czf "${archive}" "${name}" # keeps the executable bit
        fi
        echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}
        path: dist/${{ env.ARCHIVE }}
        if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > notes.md <<'EOF'
        ## Downloads

        - **Linux (x86_64)**: needs a Vulkan 1.3 driver and GTK 3.
        - **Windows (x86_64)**: needs a Vulkan 1.3 driver (shipped with the GPU drivers).
        - **macOS (Apple Silicon), experimental**: built by the CI but never run on a real Mac yet. Needs the
          [Vulkan SDK](https://vulkan.lunarg.com/sdk/home#mac) (KosmicKrisp or MoltenVK). The build isn't signed:
          after extracting, run `xattr -dr com.apple.quarantine VectrixEditor-*` once, or macOS refuses to open it.

        Keep the `assets` folder next to the executable.
        EOF
        gh release create "${GITHUB_REF_NAME}" dist/* \
          --repo "${GITHUB_REPOSITORY}" \
          --title "Vectrix ${GITHUB_REF_NAME}" \
          --notes-file notes.md \
          --generate-notes
