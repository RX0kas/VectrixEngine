name: Vectrix MultiPlatform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # run by hand from the Actions tab, on any branch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          ninja-build \
          libvulkan-dev \
          vulkan-tools \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxinerama-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libgl1-mesa-dev \
          libgtk-3-dev

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $sdk = "C:\VulkanSDK\1.4.335.0"
        Invoke-WebRequest `
          -Uri https://sdk.lunarg.com/sdk/download/1.4.335.0/windows/vulkan-sdk.exe `
          -OutFile vulkan-sdk.exe

        $installer = Start-Process .\vulkan-sdk.exe `
          -ArgumentList "--root $sdk --accept-licenses --default-answer --confirm-command install" `
          -Wait -PassThru
        if ($installer.ExitCode -ne 0) { throw "Vulkan SDK installer failed ($($installer.ExitCode))" }

        # The installer can return while its child processes still copy files: the build then found
        # vulkan.h at configure time but not vk_platform.h. Wait for them, then check the headers are all there
        Get-Process | Where-Object { $_.Path -like "$sdk*" -or $_.Name -like "vulkan-sdk*" } | Wait-Process -Timeout 600
        foreach ($header in "vulkan\vulkan.h", "vulkan\vk_platform.h", "vulkan\vulkan_core.h") {
          if (-not (Test-Path "$sdk\Include\$header")) { throw "Vulkan SDK incomplete: $header missing" }
        }

        echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
        echo "$sdk\Bin" >> $env:GITHUB_PATH


    # Headers and loader only: the runner has no GPU, so nothing is run. VULKAN_SDK points FindVulkan at them
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja vulkan-headers vulkan-loader
        echo "VULKAN_SDK=$(brew --prefix)" >> $GITHUB_ENV

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja -y

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.config }}-

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DVECTRIX_BUILD_EDITOR=ON

    - name: Build
      run: cmake --build build --parallel
